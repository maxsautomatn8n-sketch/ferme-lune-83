<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f4e79">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vIcemw+KyhGZ46QTjwxkEzZ5vxfWbLHVtT77ENkZA8k='; style-src 'sha256-UGsv7VbYUcGmHLCK+4XKyQCKnoShACqtKJ4Wv7pf8NI='; connect-src https:; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Помощник</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fbf'/%3E%3Cpath d='M14 18h36v22H28l-9 8v-8h-5z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root {
--fs: 20px;
--fond: #eef2f7; --carte: #ffffff; --texte: #14202e; --discret: #5b6b7d; --bord: #d5dde7;
--bleu: #1f5fbf; --bleu-fonce: #1f4e79; --bulle-moi: #1f5fbf; --texte-moi: #ffffff;
--rouge: #c62828; --vert: #1e7a3c; --ambre: #f2a900; --puce: #e4ecf6;
--ombre: 0 1px 2px rgba(20,32,46,.10), 0 4px 14px rgba(20,32,46,.06);
}
@media (prefers-color-scheme: dark) {
:root {
--fond: #0f1620; --carte: #1b2634; --texte: #eaf0f7; --discret: #9fb0c3; --bord: #2c3b4e;
--bleu: #5b9bff; --bleu-fonce: #17314f; --bulle-moi: #2f6fdc; --texte-moi: #ffffff;
--rouge: #e5534b; --vert: #3fb868; --ambre: #f2b632; --puce: #223247;
--ombre: 0 1px 2px rgba(0,0,0,.5);
}
}
html[data-taille="g"] { --fs: 24px; }
html[data-taille="tg"] { --fs: 28px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { height: 100dvh; overflow: hidden; }
body {
font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
font-size: var(--fs); line-height: 1.45; background: var(--fond); color: var(--texte);
display: flex; flex-direction: column; -webkit-text-size-adjust: 100%;
}
/* ---------- En-tête ---------- */
header {
flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
background: linear-gradient(135deg, #2a6fc9, var(--bleu-fonce)); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.28); z-index: 2;
}
.identite { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1f5fbf); display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.titres { min-width: 0; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 650; line-height: 1.2; }
.titres p { margin: 2px 0 0; font-size: .75rem; opacity: .9; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.vert { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: #4ade80; animation: pulse 2s ease-out infinite; }
.vert.hors { background: #f2b632; animation: none; box-shadow: 0 0 0 3px rgba(242,182,50,.3); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.7); } 70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
.actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
/* ---------- Boutons ---------- */
button { font: inherit; border: 0; border-radius: 16px; min-height: 56px; padding: 10px 18px; cursor: pointer; transition: transform .08s ease, filter .15s ease; }
button:active { transform: scale(.97); }
button:focus-visible, textarea:focus-visible, a.appel:focus-visible { outline: 4px solid #ffb300; outline-offset: 2px; }
.rond { width: 56px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
header .rond { width: 48px; min-height: 48px; background: rgba(255,255,255,.16); color: #fff; font-size: .95rem; font-weight: 700; }
#sos { min-height: 48px; padding: 8px 16px; background: var(--rouge); color: #fff; font-weight: 700; font-size: .95rem; border-radius: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.petit { min-height: 44px; font-size: .8rem; padding: 6px 14px; background: var(--puce); color: var(--bleu); font-weight: 600; border-radius: 22px; }
/* ---------- Conversation ---------- */
#chat { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
.jour { align-self: center; font-size: .7rem; color: var(--discret); background: var(--puce); padding: 4px 12px; border-radius: 12px; }
.msg { max-width: 90%; padding: 12px 16px 8px; border-radius: 22px; line-height: 1.5; box-shadow: var(--ombre); animation: entre .22s ease-out; word-wrap: break-word; overflow-wrap: anywhere; }
.msg .corps { white-space: pre-wrap; }
.bot { align-self: flex-start; background: var(--carte); border: 1px solid var(--bord); border-bottom-left-radius: 6px; }
.moi { align-self: flex-end; background: linear-gradient(135deg, var(--bulle-moi), #1a52a8); color: var(--texte-moi); border-bottom-right-radius: 6px; }
.rappel { border-left: 6px solid var(--ambre); }
.heure { margin-top: 4px; font-size: .65rem; opacity: .65; text-align: right; }
.outils { margin-top: 8px; }
@keyframes entre { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.rep { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.rep button { flex: 1 1 140px; font-weight: 650; }
.rep .ok { background: var(--vert); color: #fff; }
.rep .danger { background: var(--rouge); color: #fff; }
.rep .neutre { background: var(--puce); color: var(--texte); }
.rep button:disabled { opacity: .5; }
.point { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--discret); margin: 6px 3px; animation: p 1.1s infinite; }
.point:nth-child(2) { animation-delay: .2s; } .point:nth-child(3) { animation-delay: .4s; }
@keyframes p { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
/* ---------- Bas : idées rapides + saisie ---------- */
#bas { flex: 0 0 auto; background: var(--carte); border-top: 1px solid var(--bord); padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,.06); }
#idees { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
#idees::-webkit-scrollbar { display: none; }
#idees:empty { display: none; }
#idees button { flex: 0 0 auto; min-height: 48px; padding: 8px 16px; border-radius: 24px; box-shadow: 0 1px 3px rgba(20,32,46,.12); background: var(--puce); color: var(--texte); font-size: .8rem; font-weight: 600; border: 1px solid var(--bord); white-space: nowrap; }
#saisie { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; font: inherit; font-size: max(16px, 1rem); resize: none; color: var(--texte); background: var(--fond); border: 2px solid var(--bord); border-radius: 28px; padding: 14px 18px; min-height: 56px; max-height: 140px; overflow-y: hidden; }
textarea::placeholder { color: var(--discret); }
#micro { background: var(--puce); font-size: 1.3rem; }
#micro.ecoute { background: var(--rouge); color: #fff; animation: p 1.1s infinite; }
#envoyer { background: linear-gradient(135deg, #2a6fc9, var(--bleu)); box-shadow: 0 2px 8px rgba(31,95,191,.4); }
#envoyer:disabled { opacity: .5; }
/* ---------- Fenêtre SOS ---------- */
#voile { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 10; }
#voile.visible { display: flex; }
#boite { background: var(--carte); color: var(--texte); border-radius: 24px; padding: 24px; max-width: 460px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
#boite h2 { margin: 0 0 8px; font-size: 1.2rem; }
#boite p { margin: 8px 0; }
#boite .rep button { min-height: 64px; font-size: 1rem; }
#boite > .petit { margin-top: 10px; }
a.appel { display: block; text-align: center; text-decoration: none; background: var(--vert); color: #fff; font-weight: 700; border-radius: 16px; padding: 16px; margin-top: 10px; }
a.appel.rouge { background: var(--rouge); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
/* Petits écrans de téléphone */
@media (max-width: 380px) {
header { padding-left: 10px; padding-right: 10px; }
.avatar { width: 40px; height: 40px; }
.avatar svg { width: 24px; height: 24px; }
h1 { font-size: 1.05rem; }
#sos { padding: 8px 12px; }
.titres p { font-size: .7rem; }
}</style>
</head>
<body>
<header>
  <div class="identite">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>
    </div>
    <div class="titres">
      <h1>Помощник</h1>
      <p><span class="vert" id="point" aria-hidden="true"></span><span id="statut">Всегда на связи</span></p>
    </div>
  </div>
  <div class="actions">
    <button id="taille" class="rond" type="button" aria-label="Размер текста" title="Размер текста">Аа</button>
    <button id="sos" type="button">🆘 Помощь</button>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<div id="bas">
  <div id="idees" aria-label="Быстрые вопросы"></div>
  <div id="saisie">
    <textarea enterkeyhint="send" id="texte" rows="1" placeholder="Напишите сюда…" aria-label="Ваше сообщение"></textarea>
    <button id="micro" class="rond" type="button" title="Сказать голосом" aria-label="Сказать голосом" hidden>🎤</button>
    <button id="envoyer" class="rond" type="button" aria-label="Отправить">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z"/></svg>
    </button>
  </div>
</div>

<div id="voile" role="dialog" aria-modal="true">
  <div id="boite"></div>
</div>

<script>"use strict";
/* Aucun réglage dans ce fichier. Le lien donné au grand-père contient le jeton ET l'adresse du webhook :
   https://TON-SITE/index.html#k=JETON&u=https://ton-n8n/webhook/chemin
   Rien de secret ni de personnel n'est dans la page : elle peut être publique. */
const CONFIG = { intervalleSondageMs: 60000 };

const $ = id => document.getElementById(id);
const chat = $("chat"), champ = $("texte"), voile = $("voile"), boite = $("boite");

// Jeton + adresse du webhook : lus une fois dans le lien (#k=...&u=...), gardés dans le téléphone, effacés de la barre d'adresse.
// Ils ne sont acceptés que ensemble : un lien qui n'apporte que l'adresse ne peut pas rediriger un jeton déjà enregistré.
let jeton = "", urlWebhook = "";
try {
  const h = new URLSearchParams(location.hash.slice(1));
  const k = h.get("k") || "", u = h.get("u") || "";
  if (k && /^https:\/\/[^\s"'<>]+$/.test(u)) {
    localStorage.setItem("papi_k", k); localStorage.setItem("papi_u", u);
    history.replaceState(null, "", location.pathname + location.search);
  }
  jeton = localStorage.getItem("papi_k") || "";
  urlWebhook = localStorage.getItem("papi_u") || "";
} catch (e) { /* stockage indisponible */ }

// Nom et numéros d'urgence : fournis par n8n, mis en cache pour que le SOS marche même sans réseau
let reglages = { nom: "", telephones: [] };
try { const c = JSON.parse(localStorage.getItem("papi_cfg") || "null"); if (c && typeof c === "object") reglages = { nom: String(c.nom || ""), telephones: Array.isArray(c.telephones) ? c.telephones : [] }; } catch (e) {}
function appliquerReglages(c) {
  if (!c || typeof c !== "object") return;
  reglages = { nom: String(c.nom || ""), telephones: Array.isArray(c.telephones) ? c.telephones : [] };
  try { localStorage.setItem("papi_cfg", JSON.stringify(reglages)); } catch (e) {}
}

const dejaVus = new Set();
let occupe = false;

function defiler() { chat.scrollTop = chat.scrollHeight; }

function heureCourte() { return new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }

// Mémoire de l'écran : les 40 derniers échanges restent sur le téléphone (jamais envoyés ailleurs)
let historique = [];
try { const h = JSON.parse(localStorage.getItem("papi_h") || "[]"); if (Array.isArray(h)) historique = h.filter(m => m && (m.q === "moi" || m.q === "bot") && typeof m.t === "string").slice(-40); } catch (e) {}
function garder(q, t, h) {
  historique.push({ q, t: String(t).slice(0, 4000), h });
  historique = historique.slice(-40);
  try { localStorage.setItem("papi_h", JSON.stringify(historique)); } catch (e) {}
}

// État de la connexion (point vert qui pulse)
function statut(ok) {
  $("point").classList.toggle("hors", !ok);
  $("statut").textContent = ok ? "Всегда на связи" : "Нет связи";
}

function ajouter(qui, texte, options = {}) {
  const d = document.createElement("div");
  d.className = "msg " + qui + (options.rappel ? " rappel" : "");
  const t = document.createElement("div");
  t.className = "corps";
  t.textContent = texte;
  d.appendChild(t);
  if (options.boutons && options.boutons.length) {
    const r = document.createElement("div"); r.className = "rep";
    options.boutons.forEach(def => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = String(def.label); b.className = def.style === "ok" ? "ok" : "neutre";
      b.onclick = async () => {
        r.querySelectorAll("button").forEach(x => x.disabled = true);
        const rep = await api("ack", { id: def.id, cmd: def.cmd, q: def.q, v: def.v, iid: def.iid });
        r.remove();
        if (rep && rep.ok) { if (rep.reply) ajouter("bot", rep.reply); }
        else ajouter("bot", "Нет связи. Нажмите кнопку ещё раз чуть позже.");
      };
      r.appendChild(b);
    });
    d.appendChild(r);
  }
  const h = document.createElement("div"); h.className = "heure"; h.textContent = options.heure || heureCourte(); d.appendChild(h);
  chat.appendChild(d); defiler();
  if (options.garder) garder(qui, texte, h.textContent);
  return d;
}

async function api(action, extra = {}) {
  if (!jeton || !urlWebhook) return null;
  const ctrl = new AbortController();
  const minuteur = setTimeout(() => ctrl.abort(), 70000);
  try {
    const r = await fetch(urlWebhook, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: jeton, action, ...extra }), signal: ctrl.signal,
      referrerPolicy: "no-referrer", credentials: "omit", cache: "no-store"
    });
    statut(true);
    if (!r.ok) return { ok: false, status: r.status };
    const j = await r.json();
    if (j && j.config) appliquerReglages(j.config);
    return j;
  } catch (e) { statut(false); return null; }
  finally { clearTimeout(minuteur); }
}

function montrerRappels(liste) {
  (Array.isArray(liste) ? liste : []).forEach(item => {
    if (!item || dejaVus.has(item.id)) return;
    dejaVus.add(item.id);
    ajouter("bot", String(item.texte), { rappel: true, boutons: Array.isArray(item.boutons) ? item.boutons : [] });
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  });
}

async function envoyer() {
  const texte = champ.value.trim();
  if (!texte || occupe) return;
  occupe = true; $("envoyer").disabled = true;
  champ.value = ""; champ.style.height = "auto";
  ajouter("moi", texte, { garder: true });
  $("idees").replaceChildren();
  const attente = document.createElement("div"); attente.className = "msg bot";
  for (let i = 0; i < 3; i++) { const s = document.createElement("span"); s.className = "point"; attente.appendChild(s); }
  chat.appendChild(attente); defiler();
  const rep = await api("chat", { text: texte });
  attente.remove();
  if (rep && rep.ok) {
    ajouter("bot", rep.reply || "Простите, не получилось ответить. Попробуйте ещё раз.", { garder: true });
    montrerRappels(rep.reminders);
  } else {
    champ.value = texte;
    ajouter("bot", rep && rep.status === 401
      ? "Эта страница не настроена. Позвоните Максиму."
      : "Нет связи. Проверьте интернет и нажмите «Отправить» ещё раз. Ваше сообщение сохранено.");
  }
  occupe = false; $("envoyer").disabled = false; champ.focus();
}

function fermer() { voile.classList.remove("visible"); boite.replaceChildren(); }
function titre(t) { const h = document.createElement("h2"); h.textContent = t; return h; }
function lienAppel(tel, texte, rouge) {
  const l = document.createElement("a"); l.className = "appel" + (rouge ? " rouge" : ""); l.href = "tel:" + tel; l.textContent = texte; return l;
}
function boutonsAppel(cible) {
  cible.appendChild(lienAppel("112", "📞 Позвонить 112", true));
  cible.appendChild(lienAppel("103", "📞 Скорая помощь 103", true));
  reglages.telephones.filter(p => p && /^\+?[0-9]{5,15}$/.test(String(p.tel))).forEach(p => cible.appendChild(lienAppel(String(p.tel), "📞 Позвонить: " + String(p.label), false)));
}

$("sos").onclick = () => {
  boite.replaceChildren();
  boite.appendChild(titre("Вам нужна срочная помощь?"));
  const p = document.createElement("p"); p.textContent = "Я сообщу Максиму."; boite.appendChild(p);
  const r = document.createElement("div"); r.className = "rep";
  const oui = document.createElement("button"); oui.className = "danger"; oui.textContent = "Да, сообщить";
  const non = document.createElement("button"); non.className = "neutre"; non.textContent = "Нет, отмена";
  non.onclick = fermer;
  oui.onclick = async () => {
    boite.replaceChildren(); boite.appendChild(titre("Звоните сразу:"));
    boutonsAppel(boite);
    const etat = document.createElement("p"); etat.textContent = "Сообщаю Максиму…"; boite.appendChild(etat);
    const f = document.createElement("button"); f.className = "petit"; f.textContent = "Закрыть"; f.onclick = fermer; boite.appendChild(f);
    const rep = await api("sos");
    etat.textContent = rep && rep.ok ? "Максим предупреждён. Если срочно, звоните 112." : "Не удалось сообщить Максиму. Позвоните ему сами или наберите 112.";
  };
  r.appendChild(oui); r.appendChild(non); boite.appendChild(r);
  voile.classList.add("visible");
};

$("envoyer").onclick = envoyer;
champ.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer(); } });
champ.addEventListener("input", () => {
  champ.style.height = "auto"; champ.style.height = Math.min(champ.scrollHeight, 140) + "px";
  champ.style.overflowY = champ.scrollHeight > 140 ? "auto" : "hidden";
});

// Saisie vocale (si le navigateur la propose)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const m = $("micro"); m.hidden = false;
  let rec = null;
  m.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = false;
    m.classList.add("ecoute");
    rec.onresult = e => { champ.value = (champ.value + " " + e.results[0][0].transcript).trim(); champ.dispatchEvent(new Event("input")); };
    rec.onend = () => { m.classList.remove("ecoute"); rec = null; };
    rec.onerror = () => { m.classList.remove("ecoute"); rec = null; };
    try { rec.start(); } catch (e) { m.classList.remove("ecoute"); rec = null; }
  };
}

// Accueil
const jourEl = document.createElement("div"); jourEl.className = "jour";
jourEl.textContent = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
chat.appendChild(jourEl);
if (!jeton || !urlWebhook) {
  ajouter("bot", "Эта страница ещё не настроена. Откройте ссылку, которую прислал Максим.");
} else {
  if (historique.length) {
    historique.forEach(m => ajouter(m.q, m.t, { heure: m.h }));
    const sep = document.createElement("div"); sep.className = "jour"; sep.textContent = "Сегодня"; chat.appendChild(sep);
    ajouter("bot", "Здравствуйте" + (reglages.nom ? ", " + reglages.nom : "") + ". Я на связи. Чем помочь?");
  } else {
    ajouter("bot", "Здравствуйте" + (reglages.nom ? ", " + reglages.nom : "") + ". Я ваш помощник. Спрашивайте о чём угодно: телефон, документы, лекарства, быт.");
  }
  [["💊 Лекарства", "Расскажите, как мне не забывать принимать лекарства."],
   ["📄 Документы", "Мне нужна помощь с документами. С чего начать?"],
   ["📱 Телефон", "Помогите разобраться с моим телефоном."],
   ["☎️ Позвонить родным", "Как мне позвонить Максиму или Ине?"]].forEach(([label, texte]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.onclick = () => { champ.value = texte; envoyer(); };
    $("idees").appendChild(b);
  });
}

// Taille du texte : нормальный / крупный / очень крупный (mémorisée)
const TAILLES = ["", "g", "tg"];
let taille = 0;
try { taille = Math.max(0, TAILLES.indexOf(localStorage.getItem("papi_t") || "")); } catch (e) {}
function appliquerTaille() { if (TAILLES[taille]) document.documentElement.dataset.taille = TAILLES[taille]; else delete document.documentElement.dataset.taille; }
appliquerTaille();
$("taille").onclick = () => { taille = (taille + 1) % TAILLES.length; appliquerTaille(); try { localStorage.setItem("papi_t", TAILLES[taille]); } catch (e) {} defiler(); };

// Application installable : la page se charge même sans réseau (le SOS reste utilisable)
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

// Lecture des rappels déposés par n8n (seulement quand la page est visible, pour ne pas user le quota n8n)
async function sonder() {
  if (document.hidden) return;
  const rep = await api("poll");
  if (rep && rep.ok) montrerRappels(rep.reminders);
}
setInterval(sonder, CONFIG.intervalleSondageMs);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sonder(); });
sonder();

/* Clavier du téléphone : la page suit la hauteur réellement visible */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const ajuster = () => { document.body.style.height = vv.height + "px"; window.scrollTo(0, 0); defiler(); };
  vv.addEventListener("resize", ajuster);
  vv.addEventListener("scroll", () => window.scrollTo(0, 0));
}
champ.addEventListener("focus", () => setTimeout(defiler, 300));</script>
</body>
